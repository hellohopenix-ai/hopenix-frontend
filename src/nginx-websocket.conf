# Nginx config for hopenix — add this INSIDE your existing `server { ... }`
# block for the backend domain (e.g. api.yourdomain.com). Needed only when
# you put Nginx (or a similar reverse proxy) in front of daphne. Skip this
# entirely for local development, and skip it too if you deploy on a
# platform (Railway, Render, Fly.io, etc.) that already proxies websockets
# for you automatically.

# Plain REST API traffic -> daphne, same as before.
location /api/ {
    proxy_pass http://127.0.0.1:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# Websocket traffic -> daphne, WITH the Upgrade/Connection headers that
# make it a websocket instead of Nginx just treating it as a dead HTTP
# request. Missing these two headers is the #1 reason "it works locally
# but the socket won't even connect once deployed behind Nginx".
location /ws/ {
    proxy_pass http://127.0.0.1:8000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Websockets are long-lived — Nginx's default 60s read timeout will
    # silently kill an idle-but-still-open chat connection. Raise it.
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
}
